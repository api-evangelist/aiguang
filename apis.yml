aid: aiguang
name: Aiguang
description: 'Aiguang (爱逛) is a Hangzhou, China live-streaming and short-video commerce
  platform built on the WeChat ecosystem. Consumers enter live rooms through the Aiguang
  WeChat mini-program and the Aiguang mobile app to take part in limited-time discounts,
  group buys and live-stream giveaways, while merchants and MCN hosts run their broadcasts
  from the Aiguang seller app and a PC live-broadcast console carrying interaction,
  marketing, promotion and analytics tooling. The platform is wired into the Youzan
  (有赞) CPS product pool so viewers can resell what they watch. Per its own user agreement
  and privacy statement (effective 2025-01-17) the platform is operated by 杭州杨杨得翼文化有限公司
  (Hangzhou Yangyang Deyi Culture Co., Ltd.). Aiguang publishes no public developer
  program, API reference or machine-readable contract; its merchant, supplier and MCN
  surfaces are reached through account logins and a merchant community forum.'
